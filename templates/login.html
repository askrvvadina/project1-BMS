{% extends "base.html" %}

{% block title %}Login | BMS{% endblock %}
{% block page_title %}Login{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-brand" aria-label="Business Management System logo">
            <div class="brand-mark">B</div>
            <div class="brand-text">
                <span class="brand-name">BMS</span>
            </div>
        </div>

        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to continue to your workspace.</p>

        <form class="auth-form" action="{{ url_for('login') }}" method="get">
            <div class="form-group">
                <label for="login-identifier">Email or Username</label>
                <input id="login-identifier" name="identifier" type="text" placeholder="Enter your email or username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
            </div>

            <div class="checkbox-row">
                <label class="checkbox-wrap" for="remember-me">
                    <input id="remember-me" name="remember" type="checkbox">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit">Sign In</button>
        </form>

        <p class="auth-links">
            Need an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>
    </div>
</section>
{% endblock %}
