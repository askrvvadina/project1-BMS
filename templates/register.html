{% extends "base.html" %}

{% block title %}Register | BMS{% endblock %}
{% block page_title %}Register{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-brand" aria-label="Business Management System logo">
            <div class="brand-mark">B</div>
            <div class="brand-text">
                <span class="brand-name">BMS</span>
            </div>
        </div>

        <h2>Create account</h2>
        <p class="auth-subtitle">Set up your business access profile.</p>

        <form class="auth-form" action="{{ url_for('register') }}" method="get">
            <div class="form-group">
                <label for="register-username">Username</label>
                <input id="register-username" name="username" type="text" placeholder="Choose a username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="register-email">Email</label>
                <input id="register-email" name="email" type="email" placeholder="Enter your email" autocomplete="email">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input id="register-password" name="password" type="password" placeholder="Password" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="register-confirm-password">Confirm Password</label>
                    <input id="register-confirm-password" name="confirm_password" type="password" placeholder="Confirm" autocomplete="new-password">
                </div>
            </div>

            <div class="form-group">
                <label for="register-role">Role</label>
                <select id="register-role" name="role">
                    <option value="Employee">Employee</option>
                    <option value="Manager">Manager</option>
                </select>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="auth-links">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</section>
{% endblock %}
