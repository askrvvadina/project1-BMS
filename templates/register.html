{% extends "base.html" %}

{% block title %}Регистрация | BMS{% endblock %}
{% block page_title %}Регистрация{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-brand" aria-label="Логотип системы управления бизнесом">
            <div class="brand-mark">B</div>
            <div class="brand-text">
                <span class="brand-name">BMS</span>
            </div>
        </div>

        <h2>Создать аккаунт</h2>
        <p class="auth-subtitle">Настройте доступ к системе управления бизнесом.</p>

        <form class="auth-form" action="{{ url_for('register') }}" method="post">
            <div class="form-group">
                <label for="register-username">Имя пользователя</label>
                <input id="register-username" name="username" type="text" placeholder="Придумайте имя пользователя" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="register-email">Электронная почта</label>
                <input id="register-email" name="email" type="email" placeholder="Введите адрес электронной почты" autocomplete="email" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="register-password">Пароль</label>
                    <input id="register-password" name="password" type="password" placeholder="Введите пароль" autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="register-confirm-password">Подтвердите пароль</label>
                    <input id="register-confirm-password" name="confirm_password" type="password" placeholder="Повторите пароль" autocomplete="new-password" required>
                </div>
            </div>

            <div class="form-group">
                <label for="register-role">Роль</label>
                <select id="register-role" name="role" required>
                    <option value="employee">Сотрудник</option>
                    <option value="manager">Менеджер</option>
                </select>
            </div>

            <button type="submit">Создать аккаунт</button>
        </form>

        <p class="auth-links">
            Уже есть аккаунт?
            <a href="{{ url_for('login') }}">Войти</a>
        </p>
    </div>
</section>
{% endblock %}
