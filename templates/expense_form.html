{% extends "base.html" %}

{% set page_title = 'Добавить расход' if mode == 'create' else 'Редактировать расход' %}
{% block title %}{{ page_title }} | BMS{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="panel-card form-panel">
    <div class="panel-header split-header">
        <h3>{{ page_title }}</h3>
        <a class="text-btn" href="{{ url_for('expenses') }}">Назад к расходам</a>
    </div>
    <form class="auth-form" method="POST" action="{{ url_for('expense_create') if mode == 'create' else url_for('expense_edit', expense_id=expense_id) }}">
        <div class="form-group">
            <label for="expense-date">Дата</label>
            <input id="expense-date" name="date" type="date" value="{{ expense.date }}" required>
        </div>
        <div class="form-group">
            <label for="expense-amount">Сумма (сом)</label>
            <input id="expense-amount" name="amount" type="number" min="0.01" step="0.01" value="{{ expense.amount }}" required>
        </div>
        <div class="form-group">
            <label for="expense-category">Категория</label>
            <select id="expense-category" name="category_id" required>
                <option value="">Выберите категорию</option>
                {% for category in categories %}<option value="{{ category.id }}" {{ 'selected' if expense.category_id|string == category.id|string else '' }}>{{ category.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="expense-branch">Филиал</label>
            <select id="expense-branch" name="branch_id" required>
                <option value="">Выберите филиал</option>
                {% for branch in branches %}<option value="{{ branch.id }}" {{ 'selected' if expense.branch_id|string == branch.id|string else '' }}>{{ branch.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="expense-description">Описание</label>
            <textarea id="expense-description" name="description" maxlength="255" rows="4" required>{{ expense.description }}</textarea>
        </div>
        <button type="submit">{{ 'Создать расход' if mode == 'create' else 'Сохранить изменения' }}</button>
    </form>
</section>
{% endblock %}
